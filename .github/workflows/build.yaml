name: Build and Push Container

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "Dockerfile"
      - "docker-compose.yaml"
      - "requirements.txt"
      - assets/
      - webapp/
      - rxconfig.py
      - alembic.ini
      - alembic/
      - .github/workflows/build.yaml

env:
  # DOCKER_IMAGE: careagain/webapp
  # uncomment if using
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_REPO }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # For Reflex to build a container,
      # injecting your environment variables at
      # container build time is often required.
      - name: Create build env file
        run: |
          cat << EOF > .build-env
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_DB_SCHEMA=${{ secrets.SUPABASE_DB_SCHEMA}}
          SUPABASE_DB_URI=${{ secrets.SUPABASE_DB_URI }}
          SUPABASE_S3_ACCESS_KEY_ID=${{ secrets.SUPABASE_S3_ACCESS_KEY_ID}}
          SUPABASE_S3_BUCKET=${{ secrets.SUPABASE_S3_BUCKET}}
          SUPABASE_S3_SECRET_ACCESS_KEY=${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY}}
          SUPABASE_URL=${{ secrets.SUPABASE_URL}}
          REFLEX_API_URL=${{ secrets.REFLEX_API_URL}}
          REFLEX_WEB_URL=${{ secrets.REFLEX_WEB_URL }}
          REFLEX_FRONTEND_PORT=${{ secrets.REFLEX_FRONTEND_PORT }}
          REFLEX_BACKEND_PORT=${{ secrets.REFLEX_BACKEND_PORT }}
          EOF

      # --- THIS IS THE CRUCIAL PART FOR Xvfb ---
      - name: Install Xvfb and x11-utils (for xclip)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils # x11-utils includes xclip

      - name: Start Xvfb (Virtual Display)
        run: |
          # Start Xvfb on display :99
          Xvfb :99 -screen 0 1280x1024x24 &
          # Export the DISPLAY variable for subsequent steps
          echo "DISPLAY=:99" >> $GITHUB_ENV
          # Allow any client to connect to the Xvfb display
          xhost +
        # Ensure DISPLAY is available for subsequent steps
        env:
          DISPLAY: :99

      - name: Build and push Docker image for linux/arm64
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --build-arg DISPLAY=$DISPLAY \
            -f Dockerfile \
            -t ${{ env.DOCKER_IMAGE }}:latest \
            -t ${{ env.DOCKER_IMAGE }}:${{ github.sha }} \
            --push .

      - name: Remove build env file
        run: rm .build-env
